remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

locale: "ko-KR"
title: ".lienoe"
subtitle: "Pwnable · CTF · Bug Bounty"
name: "노시훈"
url: "https://sihun38.github.io"
repository: "sihun38/sihun38.github.io"
search: true

author:
  name: "노시훈"
  avatar: "/assets/images/avatar.png"
  bio: ".Lienoe"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/sihun38"
      url: "https://signs63381.tistory.com/
      
include:
  - _pages

paginate: 5
paginate_path: /page:num/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      toc: true
      related: true
      sidebar:
        nav: "categories"
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
