---
layout: default
---
<section class="graph-view" id="graph-view">
  <canvas id="graph-canvas" aria-label="문서 연결 그래프"></canvas>

  <aside class="graph-panel">
    <p class="graph-panel__title">GRAPH VIEW</p>
    <ul class="graph-legend" id="graph-legend"></ul>
    <label class="graph-toggle"><input type="checkbox" id="graph-orphans" checked> 연결 없는 문서</label>
    <label class="graph-toggle"><input type="checkbox" id="graph-missing" checked> 아직 없는 문서</label>
    <button class="graph-reset" type="button" id="graph-reset">Reset view</button>
  </aside>

  <p class="graph-hint">드래그: 이동 · 휠: 확대/축소 · 점 클릭: 문서 열기</p>
  <p class="graph-empty" id="graph-empty" hidden>아직 [[ ]] 링크가 없어요. 글 본문에 [[문서 이름]]을 써 보세요.</p>
  {{ content }}
</section>
<script src="{{ '/assets/js/vscode-graph.js' | relative_url }}" defer></script>
