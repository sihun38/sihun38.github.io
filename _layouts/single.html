---
layout: default
---
<article class="doc">
  <h1 class="doc__title"><span class="md-mark">#</span> {{ page.title }}</h1>

  <div class="md" id="md">
    {{ content }}
  </div>

  {%- if page.collection == 'posts' %}
  <nav class="doc__pager">
    {%- if page.previous %}
    <a class="doc__pager-link" href="{{ page.previous.url | relative_url }}"><span class="dim">← prev</span>{{ page.previous.slug }}.md</a>
    {%- else %}<span></span>{%- endif %}
    {%- if page.next %}
    <a class="doc__pager-link doc__pager-link--next" href="{{ page.next.url | relative_url }}"><span class="dim">next →</span>{{ page.next.slug }}.md</a>
    {%- endif %}
  </nav>
  {%- endif %}
</article>
